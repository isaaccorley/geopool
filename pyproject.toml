[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.9.3,<0.10"]

[project]
name = "geopool"
version = "0.1.0"
description = "Evaluate pixel-level embedding pool methods for patch classification"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "Isaac Corley", email = "isaac.a.corley@gmail.com" }]
dependencies = [
    "numpy<2.3.0",
    "scikit-learn>=1.8.0",
    "pandas<3.0.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "tqdm>=4.65.0",
    "rasterio>=1.5.0",
    "torch<3.0.0",
    "torchvision",
    "torchgeo",
    "einops>=0.8.1",
    "rioxarray>=0.20.0",
    "xarray>=2025.12.0",
    "huggingface-hub>=1.3.4",
    "hf-transfer>=0.1.9",
    "pyproj>=3.7.2",
]


[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true

lint.isort.known-first-party = ["geopool"]
lint.extend-select = [
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "EXE",  # flake8-executable
    "FA",   # flake8-future-annotations
    "FLY",  # flynt
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "PERF", # Perflint
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PYI",  # flake8-pyi
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",
    "SIM",  # flake8-simplify
    "SLOT", # flake8-slots
    "TCH",  # flake8-type-checking
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
lint.ignore = [
    "ANN401",
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "PT011",
    "PT012",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "RET505",
    "RET506",
    "RUF005",
    "SIM108",
    "TRY003",
    "W191",
]
lint.extend-per-file-ignores."tests/**" = [
    "ANN001",
    "ANN201",
    "RUF029",
    "SIM117",
    "SIM300",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -n auto"
# Apple Accelerate BLAS emits spurious warnings during matmul even when results are correct
filterwarnings = [
    "ignore:divide by zero encountered in matmul:RuntimeWarning",
    "ignore:overflow encountered in matmul:RuntimeWarning",
    "ignore:invalid value encountered in matmul:RuntimeWarning",
]

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"

[tool.uv.sources]
torchgeo = { git = "https://github.com/torchgeo/torchgeo.git", rev = "0a1cf1a87c332659551c33af25a3841560e5df04" }

[dependency-groups]
download = [
    "earthengine-api>=1.7.10",
    "xee>=0.0.24",
    "geotessera",
    "olmoearth-pretrain-minimal",
]
dev = [
    "hf-transfer>=0.1.9",
    "huggingface-hub>=1.3.4",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "pytest>=9.0.2",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
    "ty>=0.0.14",
]

[tool.numpydoc_validation]
checks = [
    "GL06",
    "GL07",
    "GL09",
    "GL10",
    "SS01",
    "SS02",
    "SS03",
    "SS04",
    "PR01",
    "PR02",
    "PR03",
    "PR04",
    "PR05",
    "PR06",
    "RT01",
    "RT02",
    "RT03",
]
